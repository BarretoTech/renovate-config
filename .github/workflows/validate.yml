name: Validate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Validate the Renovate preset
        run: npx --yes --package renovate@44.224.1 -- renovate-config-validator --strict default.json
      - uses: archgate/setup-action@2e1631ad3551f8d044307b1114b414859b0a935f # v1.0.0
        with:
          version: v0.61.0
      - name: Check enterprise ADRs
        run: archgate check --strict --output github
